
# Cloudflare Worker project name.
name = "dns-worker"

# TypeScript entry point for the Worker.
main = "src/index.ts"

# Runtime compatibility date used by Cloudflare Workers.
compatibility_date = "2026-02-28"

# Enable Node.js-compatible APIs required by the application.
compatibility_flags = ["nodejs_compat"]

# account_id = ""

# Minify the deployed Worker bundle.
minify = true

# workers_dev = false

# Disable preview URLs for deployed versions.
preview_urls = false

[build]
# Build the project before deployment.
command = "npm run build"

[assets]
# Local directory containing static files.
directory = "./static"
binding = "ASSETS"
run_worker_first = true

# D1 Database for Profiles, Rules and Logs.
[[d1_databases]]
binding = "DB"
database_name = "dns-worker-db"
database_id = "61968366-b339-4afc-a07e-be44986f2be3"

[triggers]
# Run scheduled maintenance tasks every minute.
crons = ["* * * * *"]

[placement]
mode = "off"

[observability]
enabled = true
head_sampling_rate = 0.01

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 0.001

[vars]
# Configure JWT_SECRET separately using Cloudflare Worker Secrets.
# Do not put secrets in this file.
# CF_ZONE_ID = ""
# CF_PURGE_TOKEN must be configured as a secret if needed.

# Default upstream for fail-open emergency fallback.
FAIL_OPEN_UPSTREAM = "https://freedns.controld.com/no-ads-malware-typo"

# Maximum number of access points allowed per profile.
MAX_ACCESS_POINTS_PER_PROFILE = 100

# Maximum number of profiles allowed per user.
MAX_PROFILES_PER_USER = 10

# Used to resolve DoH domains.
SUBSTITUTE_DOMAIN = "www.okx.com"

